<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Certificate studio | Kavya Tomar</title><link rel="stylesheet" href="/certificates.css"><style>
*{box-sizing:border-box}body{margin:0;background:#07111e;color:#d4e6f2;font:15px/1.6 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:40px 24px 90px}a{color:#a5ddf5}.studio-header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:35px}h1{font-size:clamp(30px,6vw,48px);line-height:1.1;letter-spacing:-.04em;margin:12px 0}h2{font-size:22px}p{color:#91adc2}.panel{padding:28px;border:1px solid #739ab43b;border-radius:20px;background:linear-gradient(130deg,#142a3d,#0a1624);margin:24px 0}label{display:block;font-size:12px;color:#aac2d4;margin-bottom:18px}input,select{display:block;width:100%;background:#081421;color:#e0edf5;border:1px solid #739ab450;border-radius:10px;padding:13px;font:inherit;margin-top:7px}input:focus,select:focus{outline:2px solid #a5ddf5;outline-offset:2px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.drop{display:grid;place-items:center;min-height:190px;border:1px dashed #8ac5e58a;border-radius:16px;background:#142f4540;padding:25px;text-align:center;cursor:pointer;color:#d0e7f5}.drop.over{background:#204e6b;border-color:#c5edff}.drop input{max-width:340px}.drop small{display:block;color:#91adc2;margin-top:8px}.notice{min-height:28px;margin:16px 0;white-space:pre-wrap}.notice.error{color:#ffbcae}.notice.success{color:#9ee8bc}button:disabled{opacity:.55;cursor:wait}.saved-item{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid #698ba633}.saved-item strong{display:block}.saved-item span{display:block;font-size:12px;color:#91adc2}.actions{display:flex;gap:10px;flex-wrap:wrap}.danger{color:#ffbcae}progress{width:100%;accent-color:#a5ddf5}.studio-tag{font-size:11px;letter-spacing:.15em;color:#8ecce7}.session-note{font-size:12px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}@media(max-width:600px){.fields{grid-template-columns:1fr}.panel{padding:20px}.studio-header{align-items:start}.saved-item{align-items:start;flex-direction:column}}
</style></head><body><main><header class="studio-header"><div><span class="studio-tag">OWNER STUDIO</span><h1>Your milestones.<br>Your space.</h1><p>Upload once. Share with everyone.</p></div><a href="/#certificates">← Portfolio</a></header>
<section id="login-panel" class="panel"><h2>Owner sign in</h2><p>Use your private upload password.</p><form id="login-form"><label>Password<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><button class="cert-btn primary" id="login-button">Sign in ↗</button></form></section>
<div id="studio" hidden><div class="studio-header"><p class="session-note">Signed in for one hour. Uploads are public.</p><button type="button" class="cert-btn" id="logout">Sign out</button></div><section class="panel"><h2>Publish a new milestone</h2><form id="upload-form"><div class="fields"><label>Title<input id="upload-title" name="title" required maxlength="120" placeholder="e.g. Web Development Internship"></label><label>Issued by<input name="issuer" maxlength="120" placeholder="Organisation or university"></label><label>Type<select name="category"><option value="certificate">Certificate</option><option value="achievement">Achievement</option></select></label><label>Date (optional)<input type="date" name="date"></label></div><label class="drop" id="drop-zone"><span>Drop your certificate here<br><small>PDF, JPG, PNG or WebP · up to 4 MB</small></span><input type="file" id="upload-file" name="file" accept=".pdf,.jpg,.jpeg,.png,.webp" required><small id="file-info">Or choose a file from your device.</small></label><button class="cert-btn primary" id="publish-button">Publish to portfolio ↗</button><progress id="upload-progress" max="100" value="0" hidden aria-label="Upload progress"></progress></form></section><section class="panel"><h2>Published items</h2><div id="published-list">Loading…</div></section></div>
<p class="notice" id="notice" role="status" aria-live="polite"></p></main><script src="/admin.js" defer></script></body></html>
